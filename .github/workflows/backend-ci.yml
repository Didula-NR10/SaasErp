name: Backend CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:

      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: hich_erp_test
          POSTGRES_USER: hich_dev
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_ADMIN_PASSWORD }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U hich_dev -d hich_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: hich_erp
      DB_RUNTIME_USER: hich_runtime_dev
      DB_MIGRATION_USER: hich_migrator_dev

      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: hich_erp_test
      TEST_DB_RUNTIME_USER: hich_runtime_test
      TEST_DB_MIGRATION_USER: hich_migrator_test

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    defaults:
      run:
        working-directory: Backend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Initialize isolated PostgreSQL roles and databases
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          psql --host localhost --username hich_dev --dbname postgres \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --file ../infrastructure/postgres/00_create_roles.sql
          psql --host localhost --username hich_dev --dbname postgres \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE hich_erp OWNER hich_dev"
          psql --host localhost --username hich_dev --dbname hich_erp \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --file ../infrastructure/postgres/01_configure_hich_erp.sql
          psql --host localhost --username hich_dev --dbname hich_erp_test \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --file ../infrastructure/postgres/02_configure_hich_erp_test.sql

      - name: Configure ephemeral restricted database credentials
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          export DB_MIGRATION_PASSWORD="$(openssl rand -hex 32)"
          export TEST_DB_MIGRATION_PASSWORD="$(openssl rand -hex 32)"
          export DB_RUNTIME_PASSWORD="$(openssl rand -hex 32)"
          export TEST_DB_RUNTIME_PASSWORD="$(openssl rand -hex 32)"

          echo "::add-mask::$DB_MIGRATION_PASSWORD"
          echo "::add-mask::$TEST_DB_MIGRATION_PASSWORD"
          echo "::add-mask::$DB_RUNTIME_PASSWORD"
          echo "::add-mask::$TEST_DB_RUNTIME_PASSWORD"

          {
            printf 'DB_MIGRATION_PASSWORD=%s\n' "$DB_MIGRATION_PASSWORD"
            printf 'TEST_DB_MIGRATION_PASSWORD=%s\n' "$TEST_DB_MIGRATION_PASSWORD"
            printf 'DB_RUNTIME_PASSWORD=%s\n' "$DB_RUNTIME_PASSWORD"
            printf 'TEST_DB_RUNTIME_PASSWORD=%s\n' "$TEST_DB_RUNTIME_PASSWORD"
          } >> "$GITHUB_ENV"

          psql --host localhost --username hich_dev --dbname postgres \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --file ../infrastructure/postgres/03_set_ci_credentials.sql

      - name: Install isolated tenant routing test fixtures
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          psql --host localhost --username hich_dev --dbname hich_erp_test \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --file ../infrastructure/postgres/04_create_test_tenant_fixtures.sql

      - name: Build and run tests
        run: mvn -B -ntp clean verify

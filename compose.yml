services:

  # ==========================================
  # DEVELOPMENT WORKSPACE
  # ==========================================

  workspace:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile

    command: sleep infinity

    volumes:
      - .:/workspace

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - development
      - data


  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB

      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # REDIS CACHE
  # ==========================================

  redis:
    image: redis:7.4-alpine

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - data

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping

      interval: 10s
      timeout: 5s
      retries: 10


# ==========================================
# PRIVATE DOCKER NETWORKS
# ==========================================

networks:

  development:
    driver: bridge

  data:
    driver: bridge
    internal: true


# ==========================================
# PERSISTENT DATA VOLUMES
# ==========================================

volumes:
  postgres_data:
  redis_data:
services:

  # ==========================================
  # DEVELOPMENT WORKSPACE
  # ==========================================

  workspace:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile

    command: sleep infinity

    volumes:
      - .:/workspace
      - maven_cache:/home/vscode/.m2
      - vscode_cache:/home/vscode/.vscode-server
      - npm_cache:/home/vscode/.npm

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Set DB_RUNTIME_USER in .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:?Set DB_MIGRATION_USER in .env}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}

      TEST_DB_HOST: postgres
      TEST_DB_PORT: 5432
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env}
      TEST_DB_RUNTIME_USER: ${TEST_DB_RUNTIME_USER:?Set TEST_DB_RUNTIME_USER in .env}
      TEST_DB_RUNTIME_PASSWORD: ${TEST_DB_RUNTIME_PASSWORD:?Set TEST_DB_RUNTIME_PASSWORD in .env}
      TEST_DB_MIGRATION_USER: ${TEST_DB_MIGRATION_USER:?Set TEST_DB_MIGRATION_USER in .env}
      TEST_DB_MIGRATION_PASSWORD: ${TEST_DB_MIGRATION_PASSWORD:?Set TEST_DB_MIGRATION_PASSWORD in .env}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - development
      - data


  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB

      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # REDIS CACHE
  # ==========================================

  redis:
    image: redis:7.4-alpine

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - data

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping

      interval: 10s
      timeout: 5s
      retries: 10


# ==========================================
# PRIVATE DOCKER NETWORKS
# ==========================================

networks:

  development:
    driver: bridge

  data:
    driver: bridge
    internal: true


# ==========================================
# PERSISTENT DATA VOLUMES
# ==========================================

volumes:
  postgres_data:
  redis_data:

  maven_cache:
    external: true
    name: saas2_maven_cache

  vscode_cache:
    external: true
    name: saas2_vscode_cache

  npm_cache:
    external: true
    name: saas2_npm_cache
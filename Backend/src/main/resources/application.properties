# ==================================================
# APPLICATION
# ==================================================

spring.application.name=hich-erp

server.port=8080
server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=30s


# ==================================================
# POSTGRESQL DATABASE
# ==================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ==================================================
# DATABASE CONNECTION POOL
# ==================================================

spring.datasource.hikari.pool-name=HichConnectionPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ==================================================
# JPA AND HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Disable Boot's single-Flyway auto-configuration; central Flyway instances are
# configured per schema in config.FlywayConfig.
spring.flyway.enabled=false


# ==================================================
# REDIS
# ==================================================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s


# ==================================================
# ACTUATOR AND MONITORING
# ==================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

management.health.db.enabled=true
management.health.redis.enabled=true


# ==================================================
# LOGGING
# ==================================================

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO


# ==================================================
# ERROR HANDLING
# ==================================================

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false